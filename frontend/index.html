<!DOCTYPE html>
<!--
    PetHealth Tracker - Pantalla de Login (HU001)
    Entornos de Programacion - UIS 2026-II - Grupo 02
    Credenciales por defecto: admininicial / admin123456
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHealth Tracker - Iniciar Sesion</title>

    <!-- Bootstrap 5.1.3 (mismo CDN usado por el profe) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h1 class="brand-title">PetHealth Tracker</h1>
            <p class="brand-subtitle">Pasaporte Sanitario Digital de Mascotas</p>

            <!-- Caja para mensajes de error -->
            <div id="errorBox" class="alert alert-danger" style="display:none; text-align:left;"></div>

            <!-- Formulario de login -->
            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control" id="nombreUsuario"
                       placeholder="Usuario" autocomplete="username">
                <label for="nombreUsuario"><i class="bi bi-person"></i> Usuario</label>
            </div>

            <div class="form-floating mb-3 text-start">
                <input type="password" class="form-control" id="password"
                       placeholder="Contrasena" autocomplete="current-password">
                <label for="password"><i class="bi bi-lock"></i> Contrasena</label>
            </div>

            <button type="button" class="btn-login" onclick="validarLogin()">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>

            <p class="help-text">
                <i class="bi bi-info-circle"></i>
                Usuario de prueba: <strong>admininicial</strong> / <strong>admin123456</strong>
            </p>
        </div>

        <p class="footer-info">
            Universidad Industrial de Santander &middot; Entornos de Programacion 2026-II &middot; Grupo 02
        </p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <script src="js/request.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
