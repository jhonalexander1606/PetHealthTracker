<!DOCTYPE html>
<!-- PetHealth Tracker - Formulario de Usuario (Crear / Editar) -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHealth - Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-pet">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html"><i class="bi bi-heart-pulse-fill"></i> PetHealth Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="menu.html"><i class="bi bi-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html"><i class="bi bi-github"></i> Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="eventos.html"><i class="bi bi-clipboard2-pulse"></i> Eventos Medicos</a></li>
                </ul>
                <button class="btn-logout" onclick="sessionStorage.clear(); window.location='index.html'">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-card">
            <div class="page-header">
                <div>
                    <h2 class="page-title"><i class="bi bi-person-plus"></i> <span id="formTitle">Nuevo Usuario</span></h2>
                    <p class="page-subtitle">Complete los datos del dueno de la mascota</p>
                </div>
            </div>

            <div id="alertBox"></div>

            <form class="form-pet" id="usuarioForm">
                <input type="hidden" id="usuario-id">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Documento <span class="text-danger">*</span></label>
                        <select class="form-select" id="usuario-tipodoc" required>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Numero de Documento <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="usuario-numdoc" required maxlength="40">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Telefono</label>
                        <input type="text" class="form-control" id="usuario-telefono" maxlength="20">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="usuario-nombre" required maxlength="255">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="usuario-email" required maxlength="255">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre de Usuario <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="usuario-user" required maxlength="100">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contrasena <span class="text-danger">*</span> <small class="text-muted" id="passwordHint"></small></label>
                        <input type="password" class="form-control" id="usuario-password" maxlength="255">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol <span class="text-danger">*</span></label>
                        <select class="form-select" id="usuario-rol">
                            <option value="DUENO">Dueno de mascota</option>
                            <option value="VETERINARIO">Veterinario</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-primary-pet" onclick="guardarUsuario()">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <button type="button" class="btn-secondary-pet" onclick="window.location='usuarios.html'">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/request.js"></script>
    <script src="js/usuarios.js"></script>
    <script>
        window.onload = function () {
            // Solo el administrador puede crear o editar usuarios
            if (getRol() !== 'ADMIN') {
                alert('No tiene permisos para gestionar usuarios.');
                window.location = 'menu.html';
                return;
            }
            cargarTiposDocumento();
            // Si estamos editando, cargar los datos
            const idEditar = sessionStorage.getItem('usuarioEditar');
            if (idEditar) {
                document.getElementById('formTitle').textContent = 'Editar Usuario';
                document.getElementById('passwordHint').textContent = '(dejar en blanco para no cambiarla)';
                cargarUsuarioParaEditar(idEditar);
            } else {
                document.getElementById('usuario-password').required = true;
            }
        };
    </script>
</body>
</html>
