<!DOCTYPE html>
<!--
    PetHealth Tracker - Listado de Usuarios (CRUD de Jhon Alexander Calderon)
    HU002, HU003, HU004, HU005
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHealth - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-pet">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html"><i class="bi bi-heart-pulse-fill"></i> PetHealth Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="menu.html"><i class="bi bi-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html"><i class="bi bi-github"></i> Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="eventos.html"><i class="bi bi-clipboard2-pulse"></i> Eventos Medicos</a></li>
                </ul>
                <button class="btn-logout" onclick="sessionStorage.clear(); window.location='index.html'">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-card">
            <div class="page-header">
                <div>
                    <h2 class="page-title"><i class="bi bi-people-fill"></i> Gestion de Usuarios</h2>
                    <p class="page-subtitle">Duenos de mascotas registrados en el sistema </p>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="buscarCedula" placeholder="Buscar por cedula o nombre..." style="width: 240px;" oninput="buscarUsuario()">
                    <button class="btn-primary-pet" onclick="window.location='form_usuarios.html'">
                        <i class="bi bi-plus-circle"></i> Nuevo Usuario
                    </button>
                </div>
            </div>

            <div id="alertBox"></div>

            <div class="table-responsive">
                <table class="table-pet">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Documento</th>
                            <th>Nombre Completo</th>
                            <th>Email</th>
                            <th>Telefono</th>
                            <th>Usuario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuario-table">
                        <tr><td colspan="7" class="text-center text-muted py-4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/request.js"></script>
    <script src="js/usuarios.js"></script>
    <script>
        window.onload = function () {
            // El modulo de usuarios es exclusivo del administrador
            if (getRol() !== 'ADMIN') {
                alert('No tiene permisos para acceder a la gestion de usuarios.');
                window.location = 'menu.html';
                return;
            }
            loadData();
        };
    </script>
</body>
</html>
