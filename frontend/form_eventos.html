<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHealth - Formulario de Evento Medico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-pet">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html"><i class="bi bi-heart-pulse-fill"></i> PetHealth Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="menu.html"><i class="bi bi-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html"><i class="bi bi-github"></i> Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="eventos.html"><i class="bi bi-clipboard2-pulse"></i> Eventos Medicos</a></li>
                </ul>
                <button class="btn-logout" onclick="sessionStorage.clear(); window.location='index.html'">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-card">
            <div class="page-header">
                <div>
                    <h2 class="page-title"><i class="bi bi-clipboard2-pulse"></i> <span id="formTitle">Nuevo Evento Medico</span></h2>
                    <p class="page-subtitle">Registre vacuna, consulta, desparasitacion o cualquier evento clinico (HU007)</p>
                </div>
            </div>

            <div id="alertBox"></div>

            <form class="form-pet" id="eventoForm">
                <input type="hidden" id="evento-id">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Mascota <span class="text-danger">*</span></label>
                        <select class="form-select" id="evento-mascota" required>
                            <option value="">Seleccione la mascota...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de Evento <span class="text-danger">*</span></label>
                        <select class="form-select" id="evento-tipo" required>
                            <option value="">Seleccione...</option>
                            <option value="VACUNA ANTIRRABICA">Vacuna Antirrabica</option>
                            <option value="VACUNA TRIPLE FELINA">Vacuna Triple Felina</option>
                            <option value="VACUNA POLIVALENTE">Vacuna Polivalente</option>
                            <option value="DESPARASITACION">Desparasitacion</option>
                            <option value="CONSULTA GENERAL">Consulta General</option>
                            <option value="CIRUGIA">Cirugia</option>
                            <option value="ESTERILIZACION">Esterilizacion</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha de Aplicacion <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="evento-fecha" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Proxima Dosis</label>
                        <input type="date" class="form-control" id="evento-proxima">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Veterinaria / Clinica</label>
                        <input type="text" class="form-control" id="evento-clinica" maxlength="200">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Veterinario</label>
                        <input type="text" class="form-control" id="evento-veterinario" maxlength="150">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Notas / Diagnostico</label>
                        <textarea class="form-control" id="evento-notas" rows="3"
                                  placeholder="Observaciones del veterinario..."></textarea>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-primary-pet" onclick="guardarEvento()">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <button type="button" class="btn-secondary-pet" onclick="window.location='eventos.html'">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/request.js"></script>
    <script src="js/eventos.js"></script>
    <script>
        window.onload = function () {
            cargarMascotasCombo();
            const idEditar = sessionStorage.getItem('eventoEditar');
            if (idEditar) {
                document.getElementById('formTitle').textContent = 'Editar Evento Medico';
                setTimeout(function () { cargarEventoParaEditar(idEditar); }, 300);
            }
        };
    </script>
</body>
</html>
