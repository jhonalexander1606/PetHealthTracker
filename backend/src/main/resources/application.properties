# =====================================================================
# PetHealth Tracker - Configuracion de la aplicacion
# Entornos de Programacion - UIS 2026-II - Grupo 02
# =====================================================================

# Nombre e identificacion del microservicio
spring.application.name=PetHealthTracker

# Conexion a la base de datos MySQL / MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/pethealthtracker?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true

# Localizacion
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Puerto del servidor
server.port=8094

# Seguridad JWT
# clave secreta para firmar los tokens (debe tener al menos 32 caracteres para HS256)
jwt.secret=PetHealthTracker2026ClaveSecretaJWTGrupo02UIS1234567890
# tiempo de expiracion del token en milisegundos (8 horas = 28800000)
jwt.expiration=28800000

# Documentacion con Swagger / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS - permitir el frontend abierto desde file:// y desde servidores locales
# (los origenes se controlan por @CrossOrigin en los controllers)

# Logging
logging.level.root=INFO
logging.level.uis.edu.entorno.pethealth=DEBUG
